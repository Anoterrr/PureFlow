[project]
name = "pureflow"
version = "0.1.0"
description = "TCC Engenharia de Dados - PureFlow"
authors = [
    {name = "Gustavo Alencar", email = "prosidegcr@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
    "duckdb>=1.1.0",
    "deltalake>=0.16.0",
    "great-expectations>=1.1.0",
    "pandas>=2.2.2",
    "python-dotenv>=1.0.0",
    "dbt-duckdb>=1.7.0",
    "dagster>=1.7.0",
    "dagster-webserver>=1.7.0",
    "dagster-dbt>=0.23.0",
    "dagster-ge>=0.23.0",
    "streamlit>=1.32.0",
    "sqlalchemy>=2.0.0",
    "duckdb-engine>=0.11.0",
    "pytest>=8.0.0",
    "sqlfluff>=3.0.0",
    "sqlfluff-templater-dbt>=3.0.0",
    "bandit>=1.7.0",
    "ruff>=0.8.0",
    "pre-commit>=3.8.0"
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["dbt/target", "dbt/dbt_packages", "gx/uncommitted", "dagster_home"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = [
    "E501",   # line length handled by ruff format
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.sqlfluff.core]
templater = "dbt"
dialect = "duckdb"
run_away_limit = 10
max_line_length = 80

[tool.sqlfluff.templater.dbt]
project_dir = "./dbt"
profiles_dir = "./dbt"

[tool.sqlfluff.indentation]
tab_width = 4
indent_unit = "space"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
