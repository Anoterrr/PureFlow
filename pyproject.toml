[project]
name = "pureflow"
version = "0.1.0"
description = "TCC Engenharia de Dados - PureFlow"
authors = [
    {name = "Gustavo Alencar", email = "prosidegcr@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "dagster==1.9.11",
    "dagster-dbt==0.25.11",
    "dagster-webserver==1.9.11",
    "dbt-core==1.9.8",
    "dbt-duckdb==1.11.0",
    "deltalake==1.6.3",
    "duckdb==1.5.5",
    "great-expectations==1.22.0",
    "numpy==2.5.2",
    "pandas==3.0.5",
    "pyarrow==25.0.1",
    "python-dotenv==1.2.3",
    "pyyaml==6.0.3",
    "streamlit==1.63.0",
]

# Not shipped in the image (the dockerfile runs `uv sync --no-dev`).
[dependency-groups]
dev = [
    "bandit==1.9.4",
    "matplotlib==3.11.2",
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "ruff==0.16.6",
    "sqlfluff==4.3.0",
    "sqlfluff-templater-dbt==4.3.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["dbt/target", "dbt/dbt_packages", "gx/uncommitted", "dagster_home"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = [
    "E501",   # handled by ruff format
]

[tool.sqlfluff.core]
templater = "dbt"
dialect = "duckdb"
run_away_limit = 10
max_line_length = 80

[tool.sqlfluff.templater.dbt]
project_dir = "./dbt"
profiles_dir = "./dbt"

[tool.sqlfluff.indentation]
tab_width = 4
indent_unit = "space"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
