repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b # frozen: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  # Run through uv so the hooks use the versions pinned in uv.lock.
  - repo: local
    hooks:
      - id: ruff-lint
        name: ruff lint
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]

      - id: bandit
        name: bandit (security)
        entry: uv run bandit -r src
        language: system
        pass_filenames: false
        types: [python]

      - id: sqlfluff-lint
        name: sqlfluff lint (dbt/duckdb)
        # The dbt templater loads the profile's plugins from src/.
        entry: env PYTHONPATH=src uv run sqlfluff lint --dialect duckdb
        language: system
        files: \.sql$
