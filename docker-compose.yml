name: pureflow

services:
  # S3-compatible object storage. Images are pinned by tag and digest.
  storage:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    container_name: pureflow_storage
    ports:
      - "127.0.0.1:18900:18900" # S3 API
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_USER:-admin}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_PASSWORD:-strongpassword123}
    volumes:
      - ./data/seaweedfs_data:/data
    command: >
      server -dir=/data -ip=storage -ip.bind=0.0.0.0
      -s3 -s3.port=18900 -s3.port.iceberg=0 -s3.port.lance=0
      -master.volumeSizeLimitMB=1024 -volume.max=0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18900/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pureflow_net

  storage_init:
    image: amazon/aws-cli:2.37.13@sha256:d32864c20087d486f5988c3e70817d67a73f584a47535cada9ad97e0ea1e5196
    container_name: pureflow_storage_init
    depends_on:
      storage:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=${STORAGE_USER:-admin}
      - AWS_SECRET_ACCESS_KEY=${STORAGE_PASSWORD:-strongpassword123}
      - AWS_REGION=us-east-1
    entrypoint: >
      /bin/sh -c "
      until aws --endpoint-url http://storage:18900 s3 ls > /dev/null; do echo 'Waiting for storage...' && sleep 1; done;
      for b in ${S3_BUCKET_LANDING:-landing-zone} ${S3_BUCKET_BRONZE:-bronze} ${S3_BUCKET_SILVER:-silver} ${S3_BUCKET_GOLD:-gold}; do
        aws --endpoint-url http://storage:18900 s3api head-bucket --bucket $$b 2> /dev/null ||
        aws --endpoint-url http://storage:18900 s3 mb s3://$$b;
      done;
      echo '✅ Buckets created!';
      "
    networks:
      - pureflow_net

  storage_console:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    container_name: pureflow_storage_console
    ports:
      - "127.0.0.1:18901:23646"
    volumes:
      - ./data/seaweedfs_console:/data
    command: >
      admin -master=storage:9333 -port=23646 -ip=0.0.0.0 -dataDir=/data
      -adminUser=${STORAGE_USER:-admin} -adminPassword=${STORAGE_PASSWORD:-strongpassword123}
    depends_on:
      storage:
        condition: service_healthy
    networks:
      - pureflow_net

  dagster:
    build:
      context: .
      dockerfile: dockerfile
    container_name: pureflow_dagster
    environment:
      - DAGSTER_HOME=/app/dagster_home
      - PYTHONPATH=/app/src
      - STORAGE_USER=${STORAGE_USER:-admin}
      - STORAGE_PASSWORD=${STORAGE_PASSWORD:-strongpassword123}
      - S3_ENDPOINT=http://storage:18900
      - AWS_ACCESS_KEY_ID=${STORAGE_USER:-admin}
      - AWS_SECRET_ACCESS_KEY=${STORAGE_PASSWORD:-strongpassword123}
      - AWS_ENDPOINT_URL=http://storage:18900
      - AWS_REGION=us-east-1
      - IS_DOCKER=true
    working_dir: /app
    volumes:
      - .:/app
      - ./dagster_home:/app/dagster_home
    ports:
      - "127.0.0.1:3000:3000"
    # `dbt parse` rather than `compile`: compile reads landing data, which does
    # not exist yet on a fresh machine.
    command: >
      bash -c "echo '🚀 Initializing PureFlow Environment...' &&
               cd dbt &&
               dbt parse --profiles-dir . --profile pureflow &&
               cd /app &&
               echo '✅ dbt Manifest updated. Starting Dagster...' &&
               dagster dev -h 0.0.0.0 -p 3000 -f /app/src/orchestration.py"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      storage:
        condition: service_healthy
      storage_init:
        condition: service_completed_successfully
    networks:
      - pureflow_net

  dashboard:
    build:
      context: .
      dockerfile: dockerfile
    container_name: pureflow_dashboard
    environment:
      - STORAGE_USER=${STORAGE_USER:-admin}
      - STORAGE_PASSWORD=${STORAGE_PASSWORD:-strongpassword123}
      - S3_ENDPOINT=http://storage:18900
      - PYTHONPATH=/app/src
      - AWS_ACCESS_KEY_ID=${STORAGE_USER:-admin}
      - AWS_SECRET_ACCESS_KEY=${STORAGE_PASSWORD:-strongpassword123}
      - AWS_ENDPOINT_URL=http://storage:18900
      - AWS_REGION=us-east-1
      - IS_DOCKER=true
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:8501:8501"
    command: streamlit run /app/src/dashboard.py
    depends_on:
      storage:
        condition: service_healthy
    networks:
      - pureflow_net

  dbt_docs:
    build:
      context: .
      dockerfile: dockerfile
    container_name: pureflow_dbt_docs
    environment:
      - STORAGE_USER=${STORAGE_USER:-admin}
      - STORAGE_PASSWORD=${STORAGE_PASSWORD:-strongpassword123}
      - S3_ENDPOINT=http://storage:18900
      - DBT_READ_ONLY=true
      - PYTHONPATH=/app/src
      - AWS_ACCESS_KEY_ID=${STORAGE_USER:-admin}
      - AWS_SECRET_ACCESS_KEY=${STORAGE_PASSWORD:-strongpassword123}
      - AWS_ENDPOINT_URL=http://storage:18900
      - AWS_REGION=us-east-1
      - IS_DOCKER=true
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:8081:8081" # dbt docs
      - "127.0.0.1:8082:8082" # GX reports
    # Falls back to docs without compiled SQL when today's landing partition does not exist.
    command: >
      bash -c "python3 -m http.server 8082 --directory /app/gx/uncommitted/data_docs/local_site &
               cd /app/dbt &&
               dbt parse --profiles-dir . --profile pureflow &&
               (dbt docs generate --profiles-dir . --profile pureflow ||
                dbt docs generate --no-compile --empty-catalog --profiles-dir . --profile pureflow) &&
               dbt docs serve --profiles-dir . --profile pureflow --port 8081 --host 0.0.0.0"
    depends_on:
      dagster:
        condition: service_healthy
    networks:
      - pureflow_net

networks:
  pureflow_net:
    driver: bridge
