name: pureflow

services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: pureflow_storage
    ports:
      - "127.0.0.1:9000:9000" # API
      - "127.0.0.1:9001:9001" # Web Console
    environment:
      MINIO_ROOT_USER: ${STORAGE_USER:-admin}
      MINIO_ROOT_PASSWORD: ${STORAGE_PASSWORD:-strongpassword123}
    volumes:
      - ./data/minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pureflow_net

  minio_init:
    # quay.io, not Docker Hub: MinIO pulled their images from Hub, so the old
    # `image: minio/mc` now fails with "pull access denied" and the whole stack
    # never comes up. The server below was already on quay.io; this was not.
    image: quay.io/minio/mc:latest
    container_name: pureflow_minio_init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - STORAGE_USER=${STORAGE_USER:-admin}
      - STORAGE_PASSWORD=${STORAGE_PASSWORD:-strongpassword123}
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set pureflow http://minio:9000 $${STORAGE_USER:-admin} $${STORAGE_PASSWORD:-strongpassword123}) do echo 'Waiting for MinIO...' && sleep 1; done;
      /usr/bin/mc mb pureflow/${S3_BUCKET_LANDING:-landing-zone} || true;
      /usr/bin/mc mb pureflow/${S3_BUCKET_BRONZE:-bronze} || true;
      /usr/bin/mc mb pureflow/${S3_BUCKET_SILVER:-silver} || true;
      /usr/bin/mc mb pureflow/${S3_BUCKET_GOLD:-gold} || true;
      echo '✅ Buckets created!';
      exit 0;
      "
    networks:
      - pureflow_net

  dagster:
    build: .
    container_name: pureflow_dagster
    environment:
      - DAGSTER_HOME=/app/dagster_home
      - PYTHONPATH=/app/src
      - STORAGE_USER=${STORAGE_USER:-admin}
      - STORAGE_PASSWORD=${STORAGE_PASSWORD:-strongpassword123}
      - S3_ENDPOINT=http://minio:9000
      - AWS_ACCESS_KEY_ID=${STORAGE_USER:-admin}
      - AWS_SECRET_ACCESS_KEY=${STORAGE_PASSWORD:-strongpassword123}
      - AWS_ENDPOINT_URL=http://minio:9000
      - AWS_REGION=us-east-1
      - IS_DOCKER=true
    working_dir: /app
    volumes:
      - .:/app
      - ./dagster_home:/app/dagster_home
    ports:
      - "127.0.0.1:3000:3000"
    # MANIFEST GATE: Dagster needs a fresh dbt manifest before it can load.
    # `dbt parse`, not `dbt compile`: compile resolves the landing sources,
    # which makes the landing_read plugin actually read the S3 files. On a
    # clean machine there is no landing data yet, so compile aborted and the
    # container never started - `docker compose up` could not work from
    # scratch. parse builds the same manifest without touching storage.
    command: >
      bash -c "echo '🚀 Initializing PureFlow Environment...' &&
               cd dbt &&
               dbt parse --profiles-dir . --profile pureflow &&
               cd /app &&
               echo '✅ dbt Manifest updated. Starting Dagster...' &&
               dagster dev -h 0.0.0.0 -p 3000 -f /app/src/orchestration.py"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      minio:
        condition: service_healthy
      minio_init:
        condition: service_completed_successfully
    networks:
      - pureflow_net

  dashboard:
    build: .
    container_name: pureflow_dashboard
    environment:
      - STORAGE_USER=${STORAGE_USER:-admin}
      - STORAGE_PASSWORD=${STORAGE_PASSWORD:-strongpassword123}
      - S3_ENDPOINT=http://minio:9000
      - PYTHONPATH=/app/src
      - AWS_ACCESS_KEY_ID=${STORAGE_USER:-admin}
      - AWS_SECRET_ACCESS_KEY=${STORAGE_PASSWORD:-strongpassword123}
      - AWS_ENDPOINT_URL=http://minio:9000
      - AWS_REGION=us-east-1
      - IS_DOCKER=true
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:8501:8501"
    command: streamlit run /app/src/dashboard.py
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - pureflow_net

  dbt_docs:
    build: .
    container_name: pureflow_dbt_docs
    environment:
      - STORAGE_USER=${STORAGE_USER:-admin}
      - STORAGE_PASSWORD=${STORAGE_PASSWORD:-strongpassword123}
      - S3_ENDPOINT=http://minio:9000
      - DBT_READ_ONLY=true
      - PYTHONPATH=/app/src
      - AWS_ACCESS_KEY_ID=${STORAGE_USER:-admin}
      - AWS_SECRET_ACCESS_KEY=${STORAGE_PASSWORD:-strongpassword123}
      - AWS_ENDPOINT_URL=http://minio:9000
      - AWS_REGION=us-east-1
      - IS_DOCKER=true
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:8082:8082"
    # Port 8081 for dbt, 8082 for GX Reports
    command: >
      bash -c "python3 -m http.server 8082 --directory /app/gx/uncommitted/data_docs/local_site &
               cd /app/dbt &&
               dbt docs generate --profiles-dir . --profile pureflow &&
               dbt docs serve --profiles-dir . --profile pureflow --port 8081 --host 0.0.0.0"
    depends_on:
      dagster:
        condition: service_healthy
    networks:
      - pureflow_net

networks:
  pureflow_net:
    driver: bridge
