name: 'pureflow_dbt'
version: '1.0.0'
config-version: 2

profile: 'pureflow'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

vars:
  execution_date: '{{ env_var("EXECUTION_DATE", run_started_at.strftime("%Y-%m-%d")) }}'
  # Same variables core/config.py reads.
  bronze_bucket: '{{ env_var("S3_BUCKET_BRONZE", "bronze") }}'
  silver_bucket: '{{ env_var("S3_BUCKET_SILVER", "silver") }}'
  gold_bucket: '{{ env_var("S3_BUCKET_GOLD", "gold") }}'

# Each layer runs in its own dbt invocation, so upstream models are registered first.
on-run-start:
  - "{{ register_upstream_delta_models() }}"

clean-targets:
  - "target"
  - "dbt_packages"

models:
  pureflow_dbt:
    # Written as Delta by src/dbt_plugins/delta_write.py.
    +materialized: external
    +format: parquet
    +plugin: delta_rw
    sales:
      bronze:
        +schema: bronze
      silver:
        +schema: silver
      gold:
        +schema: gold
    customers:
      bronze:
        +schema: bronze
      silver:
        +schema: silver
