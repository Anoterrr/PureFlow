name: 'pureflow_dbt'
version: '1.0.0'
config-version: 2

profile: 'pureflow'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

vars:
  # Centralized execution date: overridable via EXECUTION_DATE, otherwise
  # defaults to this dbt invocation's own start time — no fixed date baked in.
  execution_date: '{{ env_var("EXECUTION_DATE", run_started_at.strftime("%Y-%m-%d")) }}'

clean-targets:
  - "target"
  - "dbt_packages"

models:
  pureflow_dbt:
    # Every layer materializes external + writes Delta via the delta_rw plugin
    # (src/dbt_plugins/delta_write.py) — see each model's delta_table_path.
    +materialized: external
    +format: parquet
    +plugin: delta_rw
    sales:
      bronze:
        +schema: bronze
      silver:
        +schema: silver
      gold:
        +schema: gold
    customers:
      bronze:
        +schema: bronze
      silver:
        +schema: silver
